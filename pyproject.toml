[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "monkey-native"
version = "0.5.0.dev1"
description = "Evidence-traceable game package recovery to editable native Unity 6 projects"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow==12.2.0", "pypinyin==0.55.0"]

[project.scripts]
monkey = "monkey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
astc = ["texture2ddecoder==1.0.6"]

[tool.setuptools.package-data]
"monkey.targets" = ["*.cs", "*.js"]
"monkey" = ["licenses/*.txt", "*.cjs"]
"monkey.sources" = ["*.cjs"]
