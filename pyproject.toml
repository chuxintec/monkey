[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "monkey-native"
version = "0.7.0.dev1"
description = "Evidence-traceable game package recovery to editable native Unity 6 projects"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow==12.2.0", "pypinyin==0.55.0"]

[project.scripts]
monkey = "monkey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
astc = ["texture2ddecoder==1.0.6"]

[tool.setuptools.package-data]
"monkey.targets" = ["*.cs", "*.js", "*.shader", "behaviors/*.cs", "behaviors/*.ts", "behaviors/probes/*.cs", "behaviors/probes/*.ts", "behaviors/probes/Editor/*.cs", "materials/ui_color/*.cs", "materials/ui_color/*.js", "materials/ui_color/*.shader", "materials/ui_color/*.effect", "materials/spine/*.cs", "materials/spine/*.js", "materials/spine/*.shader", "materials/spine/*.effect", "materials/sprite_outline/*.cs", "materials/sprite_outline/*.js", "materials/sprite_outline/*.shader", "materials/sprite_outline/*.effect", "materials/static_time/*.cs", "materials/static_time/*.js", "materials/static_time/*.shader", "materials/static_time/*.effect", "spine/*.cs", "spine/*.js", "spine/*.ts", "spine/*.ts.meta", "pure_lowering/*.cs", "pure_lowering/*.ts"]
"monkey" = ["licenses/*.txt", "*.cjs", "code_profiles/*.json"]
"monkey.sources" = ["*.cjs"]
